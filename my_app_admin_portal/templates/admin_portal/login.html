{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SportMate Admin Login</title><link rel="stylesheet" href="{% static 'admin_portal/admin.css' %}"></head><body class="login-page"><section class="login-card"><div class="brand">SPORT<span>MATE</span><small>ADMIN CONSOLE</small></div><h1>Welcome back</h1><p class="muted">Sign in with your authorized administrator account.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<label>Email or username<input name="identity" required autofocus autocomplete="username"></label><label>Password<div class="password"><input id="password" type="password" name="password" required autocomplete="current-password"><button type="button" onclick="togglePassword()">Show</button></div></label><button class="primary full">Sign in securely</button></form></section><script src="{% static 'admin_portal/admin.js' %}"></script></body></html>
